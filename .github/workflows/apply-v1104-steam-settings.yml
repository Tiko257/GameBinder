name: Apply V110.4 Steam Settings Layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Steam Settings into main bar
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          old='#gb-credentials-settings{display:none}'
          new='#gb-credentials-settings{display:block}'
          if old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          else:
              raise SystemExit('Expected Steam Settings CSS marker not found')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m "V110.4: move Steam Settings to main bar"
          git push
